# FilsPay stack (E02). Whole stack fits 1 vCPU / 2 GB; the API is limited to
# 0.5 vCPU / 512 MB (CASE-FILE Item 05).
#
#   ./ops/gen-env.sh                                   # once: random secrets into ops/.env.docker (gitignored)
#   docker compose --env-file ops/.env.docker -f ops/docker-compose.yml up -d --build
#   docker compose --env-file ops/.env.docker -f ops/docker-compose.yml --profile dev run --rm seed   # dev data only (E65)
#
# Dashboard + checkout: http://localhost:8080   Admin console: http://localhost:8081
# Only nginx publishes ports. Postgres (E13) and the settlement internal API
# (E94) stay on private networks. Every service has its own database role; none
# is a superuser (E91, ops/postgres/01-roles.sh).
#
# CPU / memory budget (long-running services):
#   api 0.50 / 512M · postgres 0.35 / 768M · settlement 0.05 / 128M
#   reporting 0.05 / 192M · nginx 0.05 / 64M        = 1.00 vCPU / 1664M
#   (k6 showed postgres, not the API, was the bottleneck at 0.25 — LOG §6)

name: filspay


services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run ops/gen-env.sh}
      FILSPAY_OWNER_DB_PASSWORD: ${FILSPAY_OWNER_DB_PASSWORD:?run ops/gen-env.sh}
      FILSPAY_API_DB_PASSWORD: ${FILSPAY_API_DB_PASSWORD:?run ops/gen-env.sh}
      FILSPAY_SETTLEMENT_DB_PASSWORD: ${FILSPAY_SETTLEMENT_DB_PASSWORD:?run ops/gen-env.sh}
      FILSPAY_REPORTING_DB_PASSWORD: ${FILSPAY_REPORTING_DB_PASSWORD:?run ops/gen-env.sh}
    command:
      - postgres
      - -c
      - max_connections=50
      - -c
      - shared_buffers=128MB
      - -c
      - effective_cache_size=384MB
      - -c
      - work_mem=4MB
      - -c
      - idle_in_transaction_session_timeout=60000   # E42 note: an idle open transaction must not stall reporting
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/01-roles.sh:/docker-entrypoint-initdb.d/01-roles.sh:ro
    networks: [db]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d filspay"]
      interval: 5s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits: { cpus: "0.35", memory: 768M }

  migrate:
    build: { context: .., dockerfile: ops/Dockerfile.node }
    image: filspay-node:local
    command: ["node", "/app/db/migrate.mjs"]
    restart: "no"
    environment:
      DATABASE_URL: postgres://filspay_owner:${FILSPAY_OWNER_DB_PASSWORD}@postgres:5432/filspay?sslmode=disable
    depends_on:
      postgres: { condition: service_healthy }
    networks: [db]
    deploy:
      resources:
        limits: { cpus: "0.25", memory: 256M }

  api:
    image: filspay-node:local
    command: ["node", "--max-old-space-size=384", "/app/api.mjs"]
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: postgres://filspay_api:${FILSPAY_API_DB_PASSWORD}@postgres:5432/filspay?sslmode=disable
      PG_POOL_MAX: "20"
      LOG_LEVEL: warn                  # "info" logs every request: real CPU at 0.5 vCPU
      MAX_IN_FLIGHT_REQUESTS: ${MAX_IN_FLIGHT_REQUESTS:-24}     # load shedding: above this → 503 + Retry-After
      SHED_EVENT_LOOP_DELAY_MS: ${SHED_EVENT_LOOP_DELAY_MS:-300}  # load shedding: event loop saturated → 503
      WEBHOOK_SECRET_ENCRYPTION_KEY: ${WEBHOOK_SECRET_ENCRYPTION_KEY:?run ops/gen-env.sh}
      ACQUIRER_CALLBACK_SIGNING_SECRET: ${ACQUIRER_CALLBACK_SIGNING_SECRET:?run ops/gen-env.sh}
      SETTLEMENT_INTERNAL_URL: http://settlement:8091
      SETTLEMENT_INTERNAL_TOKEN: ${SETTLEMENT_INTERNAL_TOKEN:?run ops/gen-env.sh}
      CHECKOUT_BASE_URL: ${CHECKOUT_BASE_URL:-http://localhost:8080}
      KYC_UPLOAD_DIR: /data/kyc
      COOKIE_SECURE: ${COOKIE_SECURE:-false}       # true once served over https
      OTP_DEV_EXPOSE: ${OTP_DEV_EXPOSE:-false}     # demo only: shows the OTP code in the login answer (E37); off by default
    volumes:
      - kyc:/data/kyc
    depends_on:
      postgres: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    networks: [db, internal, edge]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits: { cpus: "0.50", memory: 512M }

  settlement:
    build: { context: .., dockerfile: ops/Dockerfile.go }
    image: filspay-settlement:local
    command: ["daemon"]
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://filspay_settlement:${FILSPAY_SETTLEMENT_DB_PASSWORD}@postgres:5432/filspay?sslmode=disable
      SETTLEMENT_INTERNAL_TOKEN: ${SETTLEMENT_INTERNAL_TOKEN:?run ops/gen-env.sh}
      SETTLEMENT_PG_POOL_MAX_CONNS: "4"
    depends_on:
      postgres: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    networks: [db, internal]
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "8091"]
      interval: 15s
      timeout: 3s
      retries: 3
    deploy:
      resources:
        limits: { cpus: "0.05", memory: 128M }

  reporting:
    image: filspay-node:local
    command: ["node", "--max-old-space-size=128", "/app/reporting.mjs", "worker"]
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://filspay_reporting:${FILSPAY_REPORTING_DB_PASSWORD}@postgres:5432/filspay?sslmode=disable
      PG_POOL_MAX: "3"
    depends_on:
      postgres: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    networks: [db]
    deploy:
      resources:
        limits: { cpus: "0.05", memory: 192M }

  nginx:
    build: { context: .., dockerfile: ops/Dockerfile.web }
    image: filspay-web:local
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:8080"   # dashboard + checkout + public API (80 on the live server)
      - "${ADMIN_PORT:-8081}:8081"  # admin console
    depends_on:
      api: { condition: service_healthy }
    networks: [edge]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:8080/nginx-health"]
      interval: 10s
      timeout: 3s
      retries: 3
    deploy:
      resources:
        limits: { cpus: "0.05", memory: 64M }

  seed:   # dev data only — truncates tables (E65); never on a hosted box
    image: filspay-node:local
    profiles: ["dev"]
    command: ["echo", "seed is not bundled; run `npm run seed` against a dev database"]
    networks: [db]

networks:
  db: {}
  internal: {}
  edge: {}

volumes:
  pgdata: {}
  kyc: {}
