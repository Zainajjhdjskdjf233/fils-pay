# E02: reverse proxy for the two UIs.
#   :8080  dashboard + public checkout  (proxies /v1, but NOT /v1/admin — E86)
#   :8081  admin console                (proxies /v1)
# Hosted, these become two hostnames; both proxy to the API on the private
# compose network, so the API port is never published.
worker_processes 1;
events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 30s;
  client_max_body_size 12m;            # KYC uploads (API limit is lower)
  server_tokens off;

  upstream api { server api:3000; keepalive 16; }


  server {
    listen 8080;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    location = /nginx-health { access_log off; return 200 "ok\n"; }
    location /v1/admin { return 404; }  # E86: admin API never on the public origin
    location /v1/ {
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_read_timeout 30s;
    }
    location / {
      root /usr/share/nginx/web;
      try_files $uri /index.html;
    }
  }

  server {
    listen 8081;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    location = /nginx-health { access_log off; return 200 "ok\n"; }
    location /v1/ {
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_read_timeout 60s;
    }
    location / {
      root /usr/share/nginx/admin;
      try_files $uri /index.html;
    }
  }
}
